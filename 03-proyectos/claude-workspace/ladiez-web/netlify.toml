# Configuración para Netlify · LA DIEZ
[build]
  publish = "."

# El juego es una sola página: todo lo que no sea un archivo real va al index
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Las imágenes se guardan en el celular por un año (carga más rápido la segunda vez)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El juego en sí siempre se pide de nuevo, así ves los cambios al toque
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
