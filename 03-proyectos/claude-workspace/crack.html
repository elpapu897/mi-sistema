<!DOCTYPE html>
<html lang="es-AR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b0f; --bg2:#0c1319; --panel:#111a22; --panel2:#16222c;
  --line:#1f303c; --line2:#2b414f;
  --txt:#eef4f8; --dim:#7e93a1; --dim2:#546878;
  --ac:#00e07a; --ac2:#00a85c; --oro:#ffc93c; --rojo:#ff3b56; --azul:#2e9dff; --vio:#9b6bff;
  --sh:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:78px}
.screen{display:none;padding:14px 14px 20px;animation:in .28s cubic-bezier(.2,.8,.3,1)}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3,.cond{font-family:'Barlow Condensed',Inter,sans-serif;letter-spacing:.5px;margin:0}
h1{font-size:40px;font-weight:800;line-height:.95}
h2{font-size:26px;font-weight:700;margin-bottom:10px}
h3{font-size:19px;font-weight:700;margin-bottom:8px}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:2.2px;color:var(--dim2);text-transform:uppercase}
.dim{color:var(--dim)} .sm{font-size:12.5px} .xs{font-size:11px} .ctr{text-align:center}
.row{display:flex;gap:10px;align-items:center} .row.w{flex-wrap:wrap} .g{flex:1}
.sep{height:1px;background:var(--line);margin:12px 0}
.mt{margin-top:10px}

.panel{background:linear-gradient(165deg,var(--panel) 0%,var(--bg2) 100%);
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;position:relative;overflow:hidden}
.panel.tight{padding:10px}
.panel.glow::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,rgba(0,224,122,.10),transparent 60%);pointer-events:none}

button,.btn{font-family:Inter,sans-serif;border:0;cursor:pointer;width:100%;display:block;
  border-radius:13px;padding:14px;font-weight:800;font-size:15px;letter-spacing:.2px;
  background:linear-gradient(180deg,#00f085,#00a85c);color:#02180c;
  box-shadow:0 4px 0 #007a42,0 8px 20px rgba(0,224,122,.22);transition:transform .08s,box-shadow .08s,filter .2s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #007a42}
button:disabled{filter:grayscale(1) brightness(.55);box-shadow:none;cursor:default}
button.s{background:linear-gradient(180deg,#22323e,#16222c);color:var(--txt);box-shadow:0 3px 0 #0d151b;border:1px solid var(--line2)}
button.s:active{box-shadow:0 1px 0 #0d151b}
button.o{background:linear-gradient(180deg,#ffd76b,#e8a400);color:#3a2600;box-shadow:0 4px 0 #a87400,0 8px 20px rgba(255,201,60,.2)}
button.r{background:linear-gradient(180deg,#ff5f74,#d81f38);color:#fff;box-shadow:0 4px 0 #8e1224}
button.v{background:linear-gradient(180deg,#b48cff,#7b3ff0);color:#fff;box-shadow:0 4px 0 #52239f}
button.m{padding:9px 12px;font-size:13px;border-radius:10px}
button.auto{width:auto}
button.gh{background:transparent;color:var(--dim);box-shadow:none;border:1px solid var(--line)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}

.chip{display:inline-flex;gap:5px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;font-size:11.5px;font-weight:700}
.chip.on{background:var(--ac);color:#02180c;border-color:var(--ac)}
.tag{display:inline-block;font-size:9.5px;font-weight:900;letter-spacing:.8px;padding:3px 8px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line);text-transform:uppercase}
.tag.o{background:rgba(255,201,60,.12);border-color:var(--oro);color:var(--oro)}
.tag.r{background:rgba(255,59,86,.12);border-color:var(--rojo);color:var(--rojo)}
.tag.v{background:rgba(155,107,255,.12);border-color:var(--vio);color:var(--vio)}
.tag.a{background:rgba(46,157,255,.12);border-color:var(--azul);color:var(--azul)}
.tag.g{background:rgba(0,224,122,.12);border-color:var(--ac);color:var(--ac)}

.bar{height:7px;background:#080f14;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar.o>i{background:linear-gradient(90deg,#c98a00,var(--oro))}
.bar.r>i{background:linear-gradient(90deg,#a01528,var(--rojo))}
.bar.a>i{background:linear-gradient(90deg,#1560a8,var(--azul))}

.st{margin-bottom:9px}
.st .l{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:4px}
.st .l span:last-child{font-family:'Barlow Condensed';font-size:15px}

/* CARD JUGADOR estilo FIFA */
.pcard{background:linear-gradient(150deg,#1b2a1f 0%,#0d1a12 50%,#111a22 100%);
  border:1px solid #2c4a35;border-radius:18px;padding:14px;position:relative;overflow:hidden}
.pcard::after{content:'';position:absolute;top:-40%;left:-30%;width:60%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);transform:rotate(18deg)}
.ovr{font-family:'Barlow Condensed';font-size:56px;font-weight:800;line-height:.85;
  background:linear-gradient(180deg,#fff3c4,#ffc93c);-webkit-background-clip:text;background-clip:text;color:transparent}
.ovr.sm2{font-size:30px}

/* NAV INFERIOR */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(7,11,15,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none}
#nav.on{display:block}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px 9px}
#nav button{background:none;box-shadow:none;border:0;padding:5px 0;color:var(--dim2);font-size:9.5px;font-weight:800;letter-spacing:.4px}
#nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px;filter:grayscale(1) opacity(.55)}
#nav button.on{color:var(--ac)} #nav button.on i{filter:none}
#nav button:active{transform:none}

/* TOP */
#top{position:sticky;top:0;z-index:55;background:rgba(7,11,15,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:9px 14px;display:none}
#top.on{display:block}
.res{display:flex;gap:6px}
.res>div{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 10px;
  font-size:12px;font-weight:800;display:flex;gap:4px;align-items:center;white-space:nowrap}

/* LISTAS */
.li{display:flex;gap:11px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:13px;padding:10px 11px;margin-bottom:8px;cursor:pointer;transition:.16s}
.li:active{transform:scale(.985)}
.li.sel{border-color:var(--ac);background:linear-gradient(90deg,rgba(0,224,122,.14),var(--panel2))}
.crest{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-family:'Barlow Condensed';font-weight:800;font-size:16px;color:#fff;
  box-shadow:inset 0 -12px 16px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.4)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:10px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase}
tr.me td{background:rgba(0,224,122,.11);font-weight:800}
td.n{font-family:'Barlow Condensed';font-size:16px;text-align:center}

/* CANCHA POSICIONES */
#pitch{position:relative;width:100%;aspect-ratio:.72;border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,#0f3f24,#0a2e1a);border:1px solid #1d5c37}
#pitch .lines{position:absolute;inset:0}
.ppos{position:absolute;transform:translate(-50%,-50%);width:52px;height:38px;border-radius:9px;
  background:rgba(10,20,15,.75);border:1.5px solid #2d6b45;display:grid;place-items:center;
  font-family:'Barlow Condensed';font-weight:800;font-size:15px;color:#bfe8cf;cursor:pointer;transition:.16s}
.ppos.on{background:var(--ac);color:#02180c;border-color:#9fffcf;box-shadow:0 0 0 4px rgba(0,224,122,.22),0 6px 18px rgba(0,224,122,.4);transform:translate(-50%,-50%) scale(1.12)}

/* MODAL */
#mo{position:fixed;inset:0;background:rgba(3,6,9,.86);z-index:200;display:none;align-items:flex-end;justify-content:center}
#mo.on{display:flex}
#mob{background:linear-gradient(170deg,#16222c,#0b1218);border:1px solid var(--line2);
  border-radius:20px 20px 0 0;padding:16px 14px 22px;width:100%;max-width:560px;max-height:90vh;overflow:auto;
  animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;background:var(--line2);border-radius:99px;margin:0 auto 12px}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:300;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:400px}
.ts{background:rgba(12,32,22,.97);border:1px solid var(--ac);color:#d6ffe8;padding:10px 16px;border-radius:12px;
  font-size:13px;font-weight:700;animation:tu .3s;box-shadow:var(--sh);text-align:center}
.ts.b{background:rgba(38,12,17,.97);border-color:var(--rojo);color:#ffdde2}
.ts.o{background:rgba(38,30,10,.97);border-color:var(--oro);color:#fff3d3}
@keyframes tu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

canvas{width:100%;display:block;border-radius:14px;touch-action:none}
input,select{width:100%;background:#080f14;border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:13px;font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--ac)}
label{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--dim2);
  text-transform:uppercase;margin:14px 0 6px}
.log{background:#080f14;border:1px solid var(--line);border-radius:12px;padding:10px;
  max-height:190px;overflow:auto;font-size:12.5px;line-height:1.6}
.log b{color:var(--ac)}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:14px 0}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:400}
</style>
</head>
<body>

<div id="top"><div class="row">
  <div class="g" style="min-width:0">
    <div class="cond" style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="tN">—</div>
    <div class="xs dim" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="tC">—</div>
  </div>
  <div class="res">
    <div>⚡<span id="tE">5</span></div><div>🪙<span id="tM">0</span></div><div>💎<span id="tG">0</span></div>
  </div>
</div></div>

<div id="app"></div>

<div id="nav"><div class="in">
  <button data-t="hub" onclick="tab('hub')"><i>🏠</i>CLUB</button>
  <button data-t="plantel" onclick="tab('plantel')"><i>👥</i>PLANTEL</button>
  <button data-t="liga" onclick="tab('liga')"><i>📊</i>LIGA</button>
  <button data-t="tienda" onclick="tab('tienda')"><i>🛒</i>TIENDA</button>
  <button data-t="perfil" onclick="tab('perfil')"><i>👤</i>PERFIL</button>
</div></div>

<div id="mo" onclick="if(event.target===this)cerrar()"><div id="mob"></div></div>
<div id="toast"></div>
<div class="flash" id="flash"></div>
<script>
/* ═══════════ CRACK · núcleo ═══════════ */
const $=id=>document.getElementById(id), Q=s=>document.querySelector(s);
const rnd=(a,b)=>Math.random()*(b-a)+a, ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('es-AR');
function toast(t,k){const d=document.createElement('div');d.className='ts'+(k?' '+k:'');d.innerHTML=t;
  $('toast').appendChild(d);setTimeout(()=>{d.style.transition='.35s';d.style.opacity=0;d.style.transform='translateY(-8px)';setTimeout(()=>d.remove(),350)},2300);}
function modal(h){$('mob').innerHTML='<div class="grab"></div>'+h;$('mo').classList.add('on');}
function cerrar(){$('mo').classList.remove('on');}
function flash(ms=140){const f=$('flash');f.style.transition='none';f.style.opacity=.75;
  requestAnimationFrame(()=>{f.style.transition=ms+'ms';f.style.opacity=0;});}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ═══════════ AUDIO (sintetizado, sin archivos) ═══════════ */
const AU={ctx:null,on:true,crowd:null,gain:null,musGain:null,musTimer:null,crowdGain:null};
function auInit(){
  if(AU.ctx)return; try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  AU.gain=AU.ctx.createGain();AU.gain.gain.value=.9;AU.gain.connect(AU.ctx.destination);
  AU.musGain=AU.ctx.createGain();AU.musGain.gain.value=.35;AU.musGain.connect(AU.gain);
  AU.crowdGain=AU.ctx.createGain();AU.crowdGain.gain.value=0;AU.crowdGain.connect(AU.gain);
}
function auResume(){auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();}
function noiseBuf(sec=3){const c=AU.ctx,b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function crowdStart(vol=.16){
  auInit(); if(!AU.ctx||AU.crowd)return;
  const c=AU.ctx,src=c.createBufferSource();src.buffer=noiseBuf(4);src.loop=true;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=760;f.Q.value=.55;
  const f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=1900;
  src.connect(f);f.connect(f2);f2.connect(AU.crowdGain);src.start();
  AU.crowd={src,f};
  // oleaje del murmullo
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.09;lg.gain.value=vol*.4;
  lfo.connect(lg);lg.connect(AU.crowdGain.gain);lfo.start();AU.crowd.lfo=lfo;
  AU.crowdGain.gain.setTargetAtTime(vol,c.currentTime,1.2);
}
function crowdStop(){if(!AU.ctx||!AU.crowd)return;AU.crowdGain.gain.setTargetAtTime(0,AU.ctx.currentTime,.5);
  const cr=AU.crowd;AU.crowd=null;setTimeout(()=>{try{cr.src.stop();cr.lfo.stop()}catch(e){}},1400);}
function crowdRoar(dur=2.2,peak=.55){
  if(!AU.ctx||!AU.crowdGain)return; const t=AU.ctx.currentTime;
  AU.crowdGain.gain.cancelScheduledValues(t);
  AU.crowdGain.gain.setValueAtTime(AU.crowdGain.gain.value,t);
  AU.crowdGain.gain.linearRampToValueAtTime(peak,t+.18);
  AU.crowdGain.gain.setTargetAtTime(AU.crowd?.16:0,t+dur*.4,dur*.5);
}
function beep(freq,dur=.12,type='square',vol=.18,when=0,slide=0){
  auInit(); if(!AU.ctx||!AU.on)return; const c=AU.ctx,t=c.currentTime+when;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(AU.gain);o.start(t);o.stop(t+dur+.03);
}
const SFX={
  tap:()=>beep(520,.05,'square',.09),
  ok:()=>{beep(660,.09,'square',.13);beep(990,.12,'square',.11,.08)},
  no:()=>{beep(200,.16,'sawtooth',.13,0,-90)},
  gol:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.2,'square',.16,i*.075));crowdRoar(2.6,.6);flash(200);},
  silbato:()=>{beep(2100,.16,'square',.10);beep(2400,.18,'square',.09,.1);},
  compra:()=>{[784,1046,1318].forEach((f,i)=>beep(f,.14,'triangle',.14,i*.06))},
  nivel:()=>{[523,659,784,1046,1318].forEach((f,i)=>beep(f,.18,'triangle',.15,i*.08))},
  kick:()=>beep(150,.07,'triangle',.2,0,-70),
  post:()=>beep(1400,.09,'sine',.2,0,-400),
};
/* himno / hinchada cantando */
const CANTO=[0,0,3,3,5,5,3,-99,1,1,0,0,-2,-2,0,-99];
function musicaOn(tipo='menu'){
  auInit(); if(!AU.ctx||!AU.on)return; musicaOff();
  const base=tipo==='menu'?196:174, esp=tipo==='menu'?.42:.34; let i=0;
  AU.musTimer=setInterval(()=>{
    if(!AU.on)return;
    const n=CANTO[i%CANTO.length];
    if(n!==-99){
      const f=base*Math.pow(2,n/12);
      // voz "hinchada": dos osciladores desafinados
      voz(f,esp*.9,.10); voz(f*1.005,esp*.9,.07); voz(f/2,esp*.9,.05);
    }
    if(i%4===0) perc(); if(i%8===4) perc(1);
    i++;
  },esp*1000);
}
function voz(f,d,v){const c=AU.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=900;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.06);
  g.gain.setTargetAtTime(0,t+d*.5,d*.3);
  o.connect(fl);fl.connect(g);g.connect(AU.musGain);o.start(t);o.stop(t+d+.2);}
function perc(alto){const c=AU.ctx,t=c.currentTime,s=c.createBufferSource();s.buffer=noiseBuf(.2);
  const f=c.createBiquadFilter();f.type=alto?'highpass':'lowpass';f.frequency.value=alto?4000:200;
  const g=c.createGain();g.gain.setValueAtTime(alto?.05:.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+(alto?.06:.16));
  s.connect(f);f.connect(g);g.connect(AU.musGain);s.start(t);s.stop(t+.25);}
function musicaOff(){if(AU.musTimer){clearInterval(AU.musTimer);AU.musTimer=null}}
function toggleAudio(){AU.on=!AU.on;auResume();
  if(!AU.on){musicaOff();crowdStop();AU.gain&&(AU.gain.gain.value=0)}
  else{AU.gain&&(AU.gain.gain.value=.9);musicaOn('menu')}
  toast(AU.on?'🔊 Sonido activado':'🔇 Sonido silenciado');renderActual();}
/* ═══════════ POSICIONES ═══════════ */
const POS=[
 {id:'POR',n:'Arquero',      x:50,y:93, w:{arco:.62,fisico:.14,pase:.10,vel:.06,defensa:.08}},
 {id:'LI', n:'Lateral izq.', x:12,y:76, w:{defensa:.28,vel:.24,fisico:.16,pase:.18,regate:.14}},
 {id:'DFC',n:'Central',      x:50,y:81, w:{defensa:.44,fisico:.26,pase:.14,vel:.10,regate:.06}},
 {id:'LD', n:'Lateral der.', x:88,y:76, w:{defensa:.28,vel:.24,fisico:.16,pase:.18,regate:.14}},
 {id:'MCD',n:'Volante centr.',x:50,y:63,w:{defensa:.30,pase:.28,fisico:.22,regate:.10,tiro:.10}},
 {id:'MC', n:'Mediocampista',x:76,y:55, w:{pase:.34,regate:.20,fisico:.18,tiro:.14,defensa:.14}},
 {id:'MCO',n:'Enganche',     x:50,y:44, w:{pase:.32,regate:.28,tiro:.22,vel:.10,fisico:.08}},
 {id:'EI', n:'Extremo izq.', x:13,y:31, w:{regate:.30,vel:.30,tiro:.20,pase:.14,fisico:.06}},
 {id:'DC', n:'Delantero',    x:50,y:21, w:{tiro:.42,fisico:.20,regate:.16,vel:.16,pase:.06}},
 {id:'ED', n:'Extremo der.', x:87,y:31, w:{regate:.30,vel:.30,tiro:.20,pase:.14,fisico:.06}},
];
const posInfo=id=>POS.find(p=>p.id===id);
const GRUPO=id=>id==='POR'?'POR':['LI','DFC','LD'].includes(id)?'DEF':['MCD','MC','MCO'].includes(id)?'MED':'DEL';

const _cachePl={};
function plantel(ligaId,clubIdx,anio){
  const key=ligaId+'|'+clubIdx+'|'+anio;
  if(_cachePl[key])return _cachePl[key];
  const club=LIGAS[ligaId].clubes[clubIdx], zona=LIGAS[ligaId].zona;
  const R=seeded(hash(club.n)), R2=seeded(hash(club.n+anio));
  const jug=[]; const usados={};
  // estrellas reales
  (ESTRELLAS[club.n]||[]).forEach(s=>{
    const[n,p,r]=s.split('|');
    const edadBase=ri2(R,24,33);
    jug.push({n,p,r:+r,e:edadBase+(anio-2026),real:1});
    usados[p]=(usados[p]||0)+1;
  });
  // relleno
  let i=0;
  PLANTILLA_POS.forEach(p=>{
    if((usados[p]||0)>0){usados[p]--;return}
    if(jug.length>=24)return;
    const nm=NOM[zona][Math.floor(R()*NOM[zona].length)]+' '+NOM[zona+'a'][Math.floor(R()*NOM[zona+'a'].length)];
    const r=clamp(Math.round(club.r-3-R()*11+ (p==='DC'||p==='POR'?1:0)),48,92);
    jug.push({n:nm,p,r,e:ri2(R,17,35)+(anio-2026)*0});
    i++;
  });
  // envejecer / retirar / regenerar
  const out=jug.map(j=>{
    let J={...j};
    if(J.e>36||(J.e>34&&J.r<70)){ // regen
      const rr=seeded(hash(club.n+J.n+anio));
      J={n:(rr()<.25?pick2(rr,APODOS)+' ':'')+pick2(rr,NOM[zona])+' '+pick2(rr,NOM[zona+'a']),
         p:J.p, r:clamp(Math.round(club.r-8-rr()*10),45,80), e:ri2(rr,17,20), regen:1};
    } else if(J.e>30){ J.r=clamp(J.r-Math.round((J.e-30)*1.1),40,99); }
    else if(J.e<23){ J.r=clamp(J.r+Math.round((anio-2026)*1.2),40,99); }
    return J;
  });
  out.sort((a,b)=>b.r-a.r);
  _cachePl[key]=out; return out;
}
function ri2(R,a,b){return Math.floor(R()*(b-a+1))+a}
function pick2(R,arr){return arr[Math.floor(R()*arr.length)]}

function ovr(){const w=posInfo(G.pos).w;let s=0,t=0;for(const k in w){s+=G.st[k]*w[k];t+=w[k]}return Math.round(s/t)}
function club(){return LIGAS[G.liga].clubes[G.club]}
function miPlantel(){return plantel(G.liga,G.club,G.temp)}
function logear(t){G.log.unshift(t);if(G.log.length>50)G.log.pop()}

function tickE(){if(!G)return;if(G.ene>=G.eneMax){G.recarga=Date.now();return}
 const n=Math.floor((Date.now()-G.recarga)/RC);if(n>0){G.ene=Math.min(G.eneMax,G.ene+n);G.recarga+=n*RC}}
function txtE(){if(G.ene>=G.eneMax)return'LLENA';const f=RC-(Date.now()-G.recarga);
 return`+1 en ${Math.floor(f/60000)}:${String(Math.floor(f%60000/1000)).padStart(2,'0')}`}

let V=null,vR=null;
const K={};
addEventListener('keydown',e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=0);
const TCH={up:0,down:0,left:0,right:0,kick:0};

function empezarChoque(modo){
  auResume();SFX.silbato();CH.modo=modo;
  const W=1000,H=620,t1=TAC.find(t=>t.id===CH.tac1),t2=TAC.find(t=>t.id===CH.tac2);
  const A=LIGAS[CH.liga1].clubes[CH.club1],B=LIGAS[CH.liga2].clubes[CH.club2];
  const plA=plantel(CH.liga1,CH.club1,2026),plB=plantel(CH.liga2,CH.club2,2026);
  const nombres=(pl,k)=>{const t=pl.filter(j=>j.p!=='POR').slice(0,8);const o=[];
    for(let i=0;i<k;i++)o.push((t[i]||{n:'Jugador '+(i+1),r:70}));return o};
  const nA=nombres(plA,CH.jug),nB=nombres(plB,CH.jug);
  const mk=(x,y,col,tac,inf,eq)=>({x,y,vx:0,vy:0,r:19*tac.s,acc:.60*tac.v,kick:10.5*tac.k,
    col,cd:0,nom:inf.n.split(' ').slice(-1)[0],rate:inf.r,eq,anim:0,dir:0});
  V={W,H,modo,gA:0,gB:0,t:CH.dur,last:Date.now(),pausa:false,cel:0,shake:0,
    A,B,part:[],trail:[],
    ball:{x:W/2,y:H/2,vx:0,vy:0,r:12,rot:0},
    eqA:nA.map((inf,i)=>mk(190+ (i%2)*70,H/2+(i-(CH.jug-1)/2)*105,A.c,t1,inf,'A')),
    eqB:nB.map((inf,i)=>mk(W-190-(i%2)*70,H/2+(i-(CH.jug-1)/2)*105,B.c,t2,inf,'B')),
    goal:190};
  V.p1=V.eqA[0];V.p2=V.eqB[0];
  ir('choque');
  $('chA').textContent=A.n;$('chB').textContent=B.n;
  if('ontouchstart'in window){$('tp').style.display='block';
    document.querySelectorAll('#tp button').forEach(b=>{const k=b.dataset.k;
      const on=e=>{e.preventDefault();TCH[k]=1},off=e=>{e.preventDefault();TCH[k]=0};
      b.ontouchstart=on;b.ontouchend=off;b.ontouchcancel=off;b.onmousedown=on;b.onmouseup=off;b.onmouseleave=off})}
  musicaOff();crowdStart(.15);
  loopCh();
}
function loopCh(){
  if(!V)return;
  const cv=$('cv');if(!cv){V=null;return}
  const c=cv.getContext('2d');
  if(!V.pausa){
    const dt=Math.min(50,Date.now()-V.last);V.last=Date.now();
    V.t-=dt/1000;
    if(V.t<=0)return finCh();
    if(V.cel>0)V.cel-=dt;else fisicaCh();
    if(V.shake>0)V.shake*=.9;
  }else V.last=Date.now();
  pintarCh(c);
  $('chM').textContent=`${V.gA} - ${V.gB}`;
  const t=Math.max(0,V.t);$('chT').textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  vR=requestAnimationFrame(loopCh);
}
function fisicaCh(){
  const{W,H,ball}=V;
  let ax=0,ay=0;
  if(K.KeyA||TCH.left)ax--;if(K.KeyD||TCH.right)ax++;if(K.KeyW||TCH.up)ay--;if(K.KeyS||TCH.down)ay++;
  moverP(V.p1,ax,ay);
  if(V.modo==='local'){let bx=0,by=0;
    if(K.ArrowLeft)bx--;if(K.ArrowRight)bx++;if(K.ArrowUp)by--;if(K.ArrowDown)by++;moverP(V.p2,bx,by)}
  V.eqA.concat(V.eqB).forEach(p=>{
    p.cd=Math.max(0,p.cd-1);
    if(p===V.p1)return; if(p===V.p2&&V.modo==='local')return;
    ia(p);
  });
  if(K.Space||TCH.kick)patear(V.p1);
  if(V.modo==='local'&&(K.Enter||K.NumpadEnter))patear(V.p2);
  V.eqA.concat(V.eqB).forEach(p=>{if(p===V.p1)return;if(p===V.p2&&V.modo==='local')return;
    if(d2(p,ball)<p.r+ball.r+9&&Math.random()<.7)patear(p)});

  ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.988;ball.vy*=.988;
  ball.rot+=Math.hypot(ball.vx,ball.vy)*.05;
  V.trail.push({x:ball.x,y:ball.y,a:1});if(V.trail.length>14)V.trail.shift();
  V.trail.forEach(t=>t.a*=.9);
  const gT=(H-V.goal)/2,gB=(H+V.goal)/2;
  if(ball.y-ball.r<10){ball.y=10+ball.r;ball.vy*=-.86;SFX.post()}
  if(ball.y+ball.r>H-10){ball.y=H-10-ball.r;ball.vy*=-.86;SFX.post()}
  if(ball.x-ball.r<18){if(ball.y>gT&&ball.y<gB)return golCh('B');ball.x=18+ball.r;ball.vx*=-.86;SFX.post()}
  if(ball.x+ball.r>W-18){if(ball.y>gT&&ball.y<gB)return golCh('A');ball.x=W-18-ball.r;ball.vx*=-.86;SFX.post()}

  const all=V.eqA.concat(V.eqB);
  all.forEach(p=>{const d=d2(p,ball);
    if(d<p.r+ball.r){const nx=(ball.x-p.x)/d,ny=(ball.y-p.y)/d;
      ball.x=p.x+nx*(p.r+ball.r);ball.y=p.y+ny*(p.r+ball.r);
      const rel=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;
      if(rel<0){ball.vx-=1.65*rel*nx;ball.vy-=1.65*rel*ny}
      ball.vx+=p.vx*.30;ball.vy+=p.vy*.30}});
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j],d=d2(a,b);
    if(d<a.r+b.r){const nx=(b.x-a.x)/d,ny=(b.y-a.y)/d,ov=(a.r+b.r-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov}}
  const sp=Math.hypot(ball.vx,ball.vy);if(sp>21){ball.vx*=21/sp;ball.vy*=21/sp}
  V.part=V.part.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--;return p.l>0});
}
function moverP(p,ax,ay){const m=Math.hypot(ax,ay)||1;
  p.vx+=ax/m*p.acc;p.vy+=ay/m*p.acc;p.vx*=.90;p.vy*=.90;p.x+=p.vx;p.y+=p.vy;
  p.x=clamp(p.x,p.r+8,V.W-p.r-8);p.y=clamp(p.y,p.r+8,V.H-p.r-8);
  if(Math.hypot(p.vx,p.vy)>.4)p.dir=Math.atan2(p.vy,p.vx)}
function patear(p){if(p.cd>0)return;const b=V.ball,d=d2(p,b);
  if(d<p.r+b.r+13){const nx=(b.x-p.x)/d,ny=(b.y-p.y)/d;
    b.vx=nx*p.kick+p.vx*.55;b.vy=ny*p.kick+p.vy*.55;p.cd=13;p.anim=12;SFX.kick();
    for(let i=0;i<7;i++)V.part.push({x:b.x,y:b.y,vx:rnd(-3,3),vy:rnd(-4,1),l:ri(14,26),c:'#ffffff'})}}
function ia(p){
  const b=V.ball,ata=p.eq==='A';
  const arcoX=ata?V.W-30:30, propioX=ata?60:V.W-60;
  const idx=(ata?V.eqA:V.eqB).indexOf(p);
  let tx,ty;
  const enCampo=ata?b.x>V.W*.35:b.x<V.W*.65;
  if(idx===0||CH.jug===1){
    if(enCampo||d2(p,b)<190){const off=ata?-26:26;tx=b.x+off;ty=b.y}
    else{tx=propioX+(ata?170:-170);ty=clamp(b.y,V.H/2-130,V.H/2+130)}
  }else if(idx===1){ // acompaña
    tx=b.x+(ata?-90:90);ty=b.y+(V.H/2>b.y?80:-80);
  }else{ // aguanta atrás
    tx=propioX+(ata?90:-90);ty=clamp(b.y*.6+V.H/2*.4,60,V.H-60);
  }
  const dx=tx-p.x,dy=ty-p.y,m=Math.hypot(dx,dy)||1,e=.15;
  moverP(p,dx/m+rnd(-e,e),dy/m+rnd(-e,e));
}
function d2(a,b){return Math.max(.01,Math.hypot(a.x-b.x,a.y-b.y))}
function golCh(q){
  if(q==='A')V.gA++;else V.gB++;
  V.cel=1700;V.shake=22;SFX.gol();
  for(let i=0;i<50;i++)V.part.push({x:V.ball.x,y:V.ball.y,vx:rnd(-9,9),vy:rnd(-11,2),l:ri(30,60),
    c:pick(['#ffc93c','#00e07a','#ffffff','#2e9dff','#ff3b56'])});
  V.golTxt=q==='A'?V.A.n:V.B.n;
  V.ball={x:V.W/2,y:V.H/2,vx:0,vy:0,r:12,rot:0};V.trail=[];
  V.eqA.forEach((p,i)=>{p.x=190+(i%2)*70;p.y=V.H/2+(i-(CH.jug-1)/2)*105;p.vx=p.vy=0});
  V.eqB.forEach((p,i)=>{p.x=V.W-190-(i%2)*70;p.y=V.H/2+(i-(CH.jug-1)/2)*105;p.vx=p.vy=0});
}
function pintarCh(c){
  const{W,H}=V;
  c.save();
  if(V.shake>1)c.translate(rnd(-V.shake,V.shake),rnd(-V.shake,V.shake));
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12592f');g.addColorStop(1,'#0b3d20');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.035)';
  for(let i=0;i<10;i++)if(i%2)c.fillRect(i*W/10,0,W/10,H);
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=4;
  c.strokeRect(18,10,W-36,H-20);
  c.beginPath();c.moveTo(W/2,10);c.lineTo(W/2,H-10);c.stroke();
  c.beginPath();c.arc(W/2,H/2,80,0,7);c.stroke();
  c.beginPath();c.arc(W/2,H/2,6,0,7);c.fillStyle='rgba(255,255,255,.55)';c.fill();
  const gT=(H-V.goal)/2;
  c.lineWidth=3;c.strokeStyle='rgba(255,255,255,.35)';
  c.strokeRect(18,gT-70,120,V.goal+140);c.strokeRect(W-138,gT-70,120,V.goal+140);
  // arcos con red
  [[0,1],[W,-1]].forEach(([x,s])=>{
    c.fillStyle='rgba(255,255,255,.07)';c.fillRect(x-(s>0?0:22),gT,22,V.goal);
    c.strokeStyle='#fff';c.lineWidth=6;
    c.beginPath();c.moveTo(x+s*22,gT);c.lineTo(x,gT);c.lineTo(x,gT+V.goal);c.lineTo(x+s*22,gT+V.goal);c.stroke();
    c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1;
    for(let i=0;i<=V.goal;i+=13){c.beginPath();c.moveTo(x,gT+i);c.lineTo(x+s*22,gT+i);c.stroke()}
  });
  // estela de la pelota
  V.trail.forEach((t,i)=>{c.beginPath();c.arc(t.x,t.y,V.ball.r*(i/V.trail.length)*.9,0,7);
    c.fillStyle=`rgba(255,255,255,${t.a*.16})`;c.fill()});
  // jugadores
  V.eqA.concat(V.eqB).forEach(p=>{
    c.beginPath();c.ellipse(p.x,p.y+p.r*.75,p.r*.95,p.r*.42,0,0,7);c.fillStyle='rgba(0,0,0,.32)';c.fill();
    if(p.anim>0){p.anim--;c.beginPath();c.arc(p.x,p.y,p.r+(12-p.anim)*2.4,0,7);
      c.strokeStyle=`rgba(255,255,255,${p.anim/26})`;c.lineWidth=3;c.stroke()}
    const gg=c.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,2,p.x,p.y,p.r);
    gg.addColorStop(0,'#ffffff55');gg.addColorStop(.35,p.col);gg.addColorStop(1,'#00000066');
    c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fillStyle=gg;c.fill();
    c.lineWidth=3.5;c.strokeStyle=(p===V.p1||(p===V.p2&&V.modo==='local'))?'#ffffff':'rgba(255,255,255,.45)';c.stroke();
    if(p===V.p1||(p===V.p2&&V.modo==='local')){c.beginPath();c.arc(p.x,p.y,p.r+7,0,7);
      c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.stroke()}
    c.font='700 13px Inter,sans-serif';c.textAlign='center';
    c.fillStyle='rgba(0,0,0,.55)';c.fillText(p.nom,p.x+1,p.y-p.r-7);
    c.fillStyle='#eaf6ff';c.fillText(p.nom,p.x,p.y-p.r-8);
  });
  // partículas
  V.part.forEach(p=>{c.globalAlpha=Math.min(1,p.l/25);c.fillStyle=p.c;c.fillRect(p.x-2.5,p.y-2.5,5,5)});
  c.globalAlpha=1;
  // pelota
  const b=V.ball;
  c.beginPath();c.ellipse(b.x,b.y+b.r*.8,b.r*.9,b.r*.4,0,0,7);c.fillStyle='rgba(0,0,0,.3)';c.fill();
  c.save();c.translate(b.x,b.y);c.rotate(b.rot);
  c.beginPath();c.arc(0,0,b.r,0,7);c.fillStyle='#fff';c.fill();
  c.fillStyle='#15202a';for(let i=0;i<5;i++){c.beginPath();
    c.arc(Math.cos(i*1.256)*b.r*.52,Math.sin(i*1.256)*b.r*.52,b.r*.24,0,7);c.fill()}
  c.beginPath();c.arc(0,0,b.r*.3,0,7);c.fill();
  c.lineWidth=2;c.strokeStyle='#101820';c.beginPath();c.arc(0,0,b.r,0,7);c.stroke();c.restore();
  c.restore();
  c.textAlign='left';
  if(V.cel>0){
    c.fillStyle=`rgba(0,0,0,${.45*Math.min(1,V.cel/500)})`;c.fillRect(0,0,W,H);
    const s=1+Math.sin(Date.now()/90)*.05;
    c.save();c.translate(W/2,H/2);c.scale(s,s);c.textAlign='center';
    c.font='800 78px "Barlow Condensed",sans-serif';
    c.fillStyle='#ffc93c';c.fillText('¡GOOOOL!',0,0);
    c.font='700 26px Inter,sans-serif';c.fillStyle='#fff';c.fillText(V.golTxt||'',0,42);
    c.restore();c.textAlign='left';
  }
  if(V.pausa){c.fillStyle='rgba(0,0,0,.65)';c.fillRect(0,0,W,H);
    c.textAlign='center';c.font='800 60px "Barlow Condensed",sans-serif';c.fillStyle='#fff';
    c.fillText('PAUSA',W/2,H/2);c.textAlign='left'}
}
function pausaCh(){if(V){V.pausa=!V.pausa;SFX.tap()}}
function salirCh(){cancelAnimationFrame(vR);V=null;$('tp').style.display='none';crowdStop();musicaOn('menu');ir('choqueMenu')}
function finCh(){
  cancelAnimationFrame(vR);SFX.silbato();crowdStop();
  const{gA,gB,A,B}=V;V=null;$('tp').style.display='none';
  modal(`<div class="eyebrow">Final</div><h2 style="margin-top:4px">${A.n} vs ${B.n}</h2>
  <div class="panel pcard ctr"><div class="cond" style="font-size:56px;font-weight:800">${gA} - ${gB}</div>
   <div class="cond" style="font-size:22px;color:${gA>gB?'var(--azul)':gB>gA?'var(--rojo)':'var(--dim)'}">
     ${gA>gB?'GANÓ '+A.n.toUpperCase():gB>gA?'GANÓ '+B.n.toUpperCase():'EMPATE'}</div></div>
  <button onclick="cerrar();empezarChoque(CH.modo||'cpu')">🔁 REVANCHA</button>
  <div style="height:8px"></div><button class="s" onclick="cerrar();ir('choqueMenu')">Volver</button>`);
  musicaOn('menu');
}

/* ═══════════ INIT ═══════════ */
document.addEventListener('pointerdown',function once(){auResume();musicaOn('menu');
  document.removeEventListener('pointerdown',once)},{once:true});
setInterval(()=>{if(G&&['hub','tienda'].includes(SC)&&!$('mo').classList.contains('on'))renderActual()},6000);
addEventListener('beforeunload',()=>guardar());
ir('menu');
</script>
