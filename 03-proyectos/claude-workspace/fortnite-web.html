<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATALLA REAL — Prototipo de Mapa</title>
<style>
  :root{
    --azul:#1e9bff; --azul-osc:#0a4d9c; --morado:#8a4cff;
    --verde:#22c55e; --amarillo:#ffd23f; --naranja:#ff7a1a;
    --gris:#0e1420; --panel:rgba(10,16,26,.82); --borde:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:#05070d; font-family:"Segoe UI",system-ui,sans-serif; color:#fff; user-select:none}
  #juego{position:fixed; inset:0}
  canvas{display:block; width:100%; height:100%; cursor:crosshair}

  /* ---------- HUD ---------- */
  .hud{position:absolute; pointer-events:none; z-index:10; text-shadow:0 2px 4px rgba(0,0,0,.6)}

  /* Barra superior: vivos + tormenta */
  .top{top:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center}
  .chip{background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:8px 14px;
        display:flex; align-items:center; gap:8px; font-weight:700; backdrop-filter:blur(6px)}
  .chip .n{font-size:22px; letter-spacing:.5px}
  .chip small{opacity:.6; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:1px}
  .dot{width:10px;height:10px;border-radius:50%}
  .pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* Minimapa */
  .mini{top:14px; right:14px; width:200px}
  .mini .marco{background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:8px; backdrop-filter:blur(6px)}
  .mini canvas{width:184px; height:184px; border-radius:8px; cursor:default}
  .mini .lbl{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:11px; opacity:.75; text-transform:uppercase; letter-spacing:1px}

  /* Salud + escudo (abajo izquierda-centro) */
  .vida{bottom:96px; left:50%; transform:translateX(-50%); width:min(520px,60vw)}
  .barra{height:16px; border-radius:8px; background:rgba(0,0,0,.45); border:1px solid var(--borde); overflow:hidden; margin-top:7px; position:relative}
  .barra i{display:block; height:100%; border-radius:8px; transition:width .3s}
  .esc i{background:linear-gradient(90deg,#5fd0ff,#1e9bff)}
  .sal i{background:linear-gradient(90deg,#39e26b,#1ba84a)}
  .barra span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; letter-spacing:.5px}

  /* Inventario de armas */
  .inv{bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px}
  .slot{width:74px; height:64px; background:var(--panel); border:2px solid var(--borde); border-radius:10px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; position:relative; backdrop-filter:blur(6px)}
  .slot .k{position:absolute; top:3px; left:6px; font-size:10px; opacity:.5; font-weight:700}
  .slot .ic{font-size:22px; line-height:1}
  .slot .nm{font-size:9px; opacity:.8; text-transform:uppercase; letter-spacing:.5px}
  .slot.sel{border-color:var(--amarillo); box-shadow:0 0 0 2px rgba(255,210,63,.25),0 0 22px rgba(255,210,63,.35)}
  .r-comun{border-color:#9aa7b5} .r-raro{border-color:#2fa8ff} .r-epico{border-color:#b061ff} .r-legend{border-color:#ffae34}

  /* Materiales */
  .mats{bottom:90px; right:14px; display:flex; flex-direction:column; gap:6px; align-items:flex-end}
  .mat{background:var(--panel); border:1px solid var(--borde); border-radius:8px; padding:5px 10px; display:flex; gap:8px; align-items:center; min-width:96px; backdrop-filter:blur(6px)}
  .mat .sw{width:12px;height:12px;border-radius:3px}
  .mat b{margin-left:auto; font-variant-numeric:tabular-nums}

  /* Ayuda / controles */
  .ayuda{bottom:16px; left:16px; font-size:12px; line-height:1.9; opacity:.85; max-width:230px}
  .key{display:inline-block; min-width:20px; text-align:center; padding:1px 6px; border:1px solid var(--borde);
       border-radius:5px; background:rgba(255,255,255,.06); font-weight:700; font-size:11px; margin-right:2px}

  /* Selector de mapa */
  .maps{top:14px; left:14px; display:flex; flex-direction:column; gap:8px; pointer-events:auto}
  .maps button{background:var(--panel); border:1px solid var(--borde); border-radius:10px; color:#fff; cursor:pointer;
    padding:9px 13px; text-align:left; backdrop-filter:blur(6px); transition:.15s; font-family:inherit}
  .maps button:hover{border-color:var(--azul); transform:translateX(3px)}
  .maps button.on{border-color:var(--amarillo); background:rgba(255,210,63,.12)}
  .maps button .t{font-weight:800; font-size:13px; display:block}
  .maps button .s{font-size:10px; opacity:.6; text-transform:uppercase; letter-spacing:1px}

  /* Aviso tormenta */
  .aviso{top:74px; left:50%; transform:translateX(-50%); background:rgba(138,76,255,.9); border-radius:10px;
    padding:8px 18px; font-weight:800; letter-spacing:.5px; opacity:0; transition:opacity .4s; box-shadow:0 6px 30px rgba(138,76,255,.5)}
  .aviso.show{opacity:1}

  /* Marca de agua / titulo */
  .marca{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; z-index:2; opacity:.06; font-weight:900; font-size:11vw; letter-spacing:.5vw; white-space:nowrap}
</style>
</head>
<body>
<div id="juego">
  <canvas id="lienzo"></canvas>
  <div class="marca">BATALLA REAL</div>

  <!-- Selector de mapa -->
  <div class="hud maps" id="maps"></div>

  <!-- Vivos + tormenta -->
  <div class="hud top">
    <div class="chip"><span class="dot pulse" style="background:var(--verde)"></span><span class="n" id="vivos">98</span><small>vivos</small></div>
    <div class="chip"><span class="dot" style="background:var(--morado)"></span><small>Tormenta</small><span class="n" id="reloj">1:20</span></div>
  </div>

  <div class="hud aviso" id="aviso">⚡ LA TORMENTA SE CIERRA</div>

  <!-- Minimapa -->
  <div class="hud mini">
    <div class="marco">
      <div class="lbl"><span id="mapNom">Isla Tormenta</span><span>N ▲</span></div>
      <canvas id="mini" width="184" height="184"></canvas>
    </div>
  </div>

  <!-- Salud / escudo -->
  <div class="hud vida">
    <div class="barra esc"><i id="escBar" style="width:100%"></i><span id="escTxt">Escudo 100</span></div>
    <div class="barra sal"><i id="salBar" style="width:100%"></i><span id="salTxt">Salud 100</span></div>
  </div>

  <!-- Materiales -->
  <div class="hud mats">
    <div class="mat"><span class="sw" style="background:#c99a5b"></span>Madera<b id="mMad">312</b></div>
    <div class="mat"><span class="sw" style="background:#9aa2ac"></span>Piedra<b id="mPie">148</b></div>
    <div class="mat"><span class="sw" style="background:#e0b64e"></span>Metal<b id="mMet">76</b></div>
  </div>

  <!-- Inventario -->
  <div class="hud inv" id="inv"></div>

  <!-- Ayuda -->
  <div class="hud ayuda">
    <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> mover cámara</div>
    <div><span class="key">1-5</span> arma · <span class="key">M</span> mapa · <span class="key">Espacio</span> baliza</div>
    <div>Arrastrá con el mouse para explorar el mapa</div>
  </div>
</div>

<script>
const cv = document.getElementById('lienzo'), ctx = cv.getContext('2d');
const mc = document.getElementById('mini'), mctx = mc.getContext('2d');
let W, H, dpr = Math.min(window.devicePixelRatio||1, 2);
function resize(){
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize); resize();

// ---------- Definición de los 3 mapas ----------
// El mundo mide 2000x2000 unidades. La cámara se mueve por él.
const MUNDO = 2000;
const MAPAS = [
  {
    id:0, nombre:"Isla Tormenta", sub:"Pradera · templado",
    fondo:"#2f6b3a", agua:"#1c6fb0", playa:"#d8c98f",
    rios:[[[200,0],[380,600],[300,1200],[520,2000]], [[1400,0],[1250,700],[1500,1400],[1350,2000]]],
    lagos:[[1000,1050,220]],
    caminos:[[[0,600],[2000,650]],[[900,0],[950,2000]],[[300,300],[1700,1600]]],
    pois:[
      {x:950,y:1050,n:"Torre Central",r:150,tipo:"ciudad"},
      {x:400,y:400,n:"Molino del Trigo",r:110,tipo:"granja"},
      {x:1550,y:450,n:"Puerto Óxido",r:120,tipo:"ciudad"},
      {x:1650,y:1500,n:"Cañón Rojo",r:130,tipo:"montaña"},
      {x:500,y:1550,n:"Villa Pino",r:110,tipo:"bosque"},
      {x:1200,y:1650,n:"Faro Sur",r:90,tipo:"costa"},
      {x:250,y:1000,n:"Cuevas Húmedas",r:90,tipo:"cueva"},
    ],
  },
  {
    id:1, nombre:"Ciudad Neón", sub:"Metrópolis · nocturno",
    fondo:"#12131f", agua:"#182a55", playa:"#3a3d52",
    rios:[[[700,0],[720,2000]]],
    lagos:[],
    caminos:[[[0,400],[2000,400]],[[0,800],[2000,800]],[[0,1200],[2000,1200]],[[0,1600],[2000,1600]],
             [[400,0],[400,2000]],[[1000,0],[1000,2000]],[[1600,0],[1600,2000]]],
    pois:[
      {x:1000,y:1000,n:"Plaza Central",r:160,tipo:"ciudad"},
      {x:400,y:400,n:"Distrito Bancario",r:120,tipo:"ciudad"},
      {x:1600,y:600,n:"Estadio Vórtice",r:130,tipo:"arena"},
      {x:500,y:1600,n:"Barrio Bajo",r:120,tipo:"ciudad"},
      {x:1600,y:1500,n:"Fábrica Watt",r:120,tipo:"industria"},
      {x:1050,y:1650,n:"Metro Abandonado",r:100,tipo:"cueva"},
    ],
  },
  {
    id:2, nombre:"Bosque Helado", sub:"Tundra · nieve",
    fondo:"#d7e4ee", agua:"#7db3d9", playa:"#c3d2dc",
    rios:[[[500,0],[600,900],[450,2000]]],
    lagos:[[1300,700,260],[600,1400,180]],
    caminos:[[[0,1000],[2000,1050]],[[1100,0],[1150,2000]]],
    pois:[
      {x:1150,y:1000,n:"Refugio Alpino",r:140,tipo:"montaña"},
      {x:500,y:450,n:"Aserradero Nieve",r:120,tipo:"bosque"},
      {x:1550,y:500,n:"Pico Congelado",r:140,tipo:"montaña"},
      {x:400,y:1550,n:"Lago Helado",r:120,tipo:"costa"},
      {x:1600,y:1550,n:"Mina Glaciar",r:120,tipo:"cueva"},
      {x:900,y:1650,n:"Cabañas del Ciervo",r:100,tipo:"bosque"},
    ],
  },
];
let mapaActual = 0;

// ---------- Contenido generado por mapa (cofres, árboles, edificios) ----------
// PRNG determinista para que cada mapa se vea igual cada vez.
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
let props = {cofres:[], arboles:[], edificios:[], drops:[]};
function generarProps(){
  const m = MAPAS[mapaActual], rnd = rng(1000+mapaActual*7);
  props = {cofres:[], arboles:[], edificios:[], drops:[]};
  // Edificios y cofres agrupados en cada POI
  m.pois.forEach((p,idx)=>{
    const nEd = 4 + Math.floor(rnd()*6);
    for(let i=0;i<nEd;i++){
      const a = rnd()*Math.PI*2, d = rnd()*p.r*0.8;
      const w = 30+rnd()*50, h = 30+rnd()*50;
      props.edificios.push({x:p.x+Math.cos(a)*d, y:p.y+Math.sin(a)*d, w, h, rot:rnd()*0.4-0.2, tipo:p.tipo});
    }
    const nCof = 3 + Math.floor(rnd()*4);
    for(let i=0;i<nCof;i++){
      const a = rnd()*Math.PI*2, d = rnd()*p.r;
      props.cofres.push({x:p.x+Math.cos(a)*d, y:p.y+Math.sin(a)*d, t:rnd()});
    }
  });
  // Árboles dispersos (menos en ciudad)
  const densidad = mapaActual===1 ? 120 : 340;
  for(let i=0;i<densidad;i++){
    const x=rnd()*MUNDO, y=rnd()*MUNDO;
    // evitar agua central de lagos
    let ok=true;
    m.lagos.forEach(l=>{ if(Math.hypot(x-l[0],y-l[1])<l[2]) ok=false; });
    if(ok) props.arboles.push({x,y,s:8+rnd()*8, nieve:mapaActual===2});
  }
  // 2 cajas de suministro (supply drops)
  for(let i=0;i<2;i++) props.drops.push({x:300+rnd()*1400, y:300+rnd()*1400});
}

// ---------- Cámara ----------
const cam = {x:MUNDO/2, y:MUNDO/2, z:0.55, vx:0, vy:0};
const teclas = {};
window.addEventListener('keydown', e=>{
  teclas[e.key.toLowerCase()]=true;
  if(e.key>='1'&&e.key<='5'){ armaSel=+e.key-1; render(); pintarInv(); }
  if(e.key.toLowerCase()==='m'){ cam.z = cam.z>0.5?0.28:0.6; }
  if(e.key===' '){ soltarBaliza(); e.preventDefault(); }
});
window.addEventListener('keyup', e=>{ teclas[e.key.toLowerCase()]=false; });

// Arrastre con mouse
let arrastrando=false, lx=0, ly=0;
cv.addEventListener('mousedown', e=>{ arrastrando=true; lx=e.clientX; ly=e.clientY; });
window.addEventListener('mouseup', ()=> arrastrando=false);
window.addEventListener('mousemove', e=>{
  if(!arrastrando) return;
  cam.x -= (e.clientX-lx)/cam.z; cam.y -= (e.clientY-ly)/cam.z;
  lx=e.clientX; ly=e.clientY;
});
cv.addEventListener('wheel', e=>{ cam.z = Math.max(0.22, Math.min(1.1, cam.z * (e.deltaY<0?1.1:0.9))); e.preventDefault(); }, {passive:false});

// Baliza (marcador de ping)
let baliza=null;
function soltarBaliza(){ baliza={x:cam.x, y:cam.y, t:performance.now()}; }

// ---------- Tormenta (círculo seguro que se cierra) ----------
let storm = {cx:MUNDO/2, cy:MUNDO/2, r:1400, rDest:1400, tFase:80};
function reiniciarStorm(){
  const m=MAPAS[mapaActual], rnd=rng(50+mapaActual);
  storm.cx=MUNDO/2; storm.cy=MUNDO/2; storm.r=1500; storm.rDest=1500; storm.tFase=80;
}

// ---------- Bus de batalla ----------
const bus = {x:-100, y:400, ang:0.25, activo:true};
function reiniciarBus(){ bus.x=-150; bus.y=200+Math.random()*1600; bus.ang=0.15+Math.random()*0.3; bus.activo=true; }

// ---------- Inventario ----------
const ARMAS = [
  {ic:"🔫", nm:"Pistola", r:"r-comun"},
  {ic:"🔪", nm:"Rifle", r:"r-raro"},
  {ic:"💥", nm:"Escopeta", r:"r-epico"},
  {ic:"🎯", nm:"Francotirador", r:"r-legend"},
  {ic:"🧪", nm:"Escudos", r:"r-raro"},
];
let armaSel=1;
function pintarInv(){
  const cont=document.getElementById('inv'); cont.innerHTML='';
  ARMAS.forEach((a,i)=>{
    const d=document.createElement('div');
    d.className='slot '+a.r+(i===armaSel?' sel':'');
    d.innerHTML=`<span class="k">${i+1}</span><span class="ic">${a.ic}</span><span class="nm">${a.nm}</span>`;
    d.onclick=()=>{ armaSel=i; pintarInv(); };
    cont.appendChild(d);
  });
}

// ---------- Selector de mapa (UI) ----------
function pintarMaps(){
  const cont=document.getElementById('maps'); cont.innerHTML='';
  MAPAS.forEach(m=>{
    const b=document.createElement('button');
    b.className = m.id===mapaActual?'on':'';
    b.innerHTML=`<span class="t">${m.nombre}</span><span class="s">${m.sub}</span>`;
    b.onclick=()=>cambiarMapa(m.id);
    cont.appendChild(b);
  });
}
function cambiarMapa(id){
  mapaActual=id;
  document.getElementById('mapNom').textContent=MAPAS[id].nombre;
  generarProps(); reiniciarStorm(); reiniciarBus(); baliza=null;
  cam.x=MUNDO/2; cam.y=MUNDO/2;
  pintarMaps();
}

// ---------- Dibujo del mundo ----------
function w2s(wx,wy){ return {x:(wx-cam.x)*cam.z + W/2, y:(wy-cam.y)*cam.z + H/2}; }

function poligono(pts, cierra){ ctx.beginPath(); pts.forEach((p,i)=>{ const s=w2s(p[0],p[1]); i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y); }); if(cierra)ctx.closePath(); }

function render(){
  const m=MAPAS[mapaActual];
  // Fondo terreno
  ctx.fillStyle=m.fondo; ctx.fillRect(0,0,W,H);

  // Textura sutil de terreno (parches)
  const rnd=rng(9+mapaActual);
  ctx.globalAlpha=0.06;
  for(let i=0;i<90;i++){
    const x=rnd()*MUNDO, y=rnd()*MUNDO, s=w2s(x,y), rad=(40+rnd()*90)*cam.z;
    ctx.fillStyle= i%2? '#000':'#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,rad,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Lagos
  m.lagos.forEach(l=>{
    const s=w2s(l[0],l[1]);
    ctx.fillStyle=m.playa; ctx.beginPath(); ctx.arc(s.x,s.y,(l[2]+14)*cam.z,0,7); ctx.fill();
    ctx.fillStyle=m.agua; ctx.beginPath(); ctx.arc(s.x,s.y,l[2]*cam.z,0,7); ctx.fill();
  });
  // Ríos
  ctx.lineCap='round'; ctx.lineJoin='round';
  m.rios.forEach(r=>{
    ctx.strokeStyle=m.playa; ctx.lineWidth=54*cam.z; poligono(r,false); ctx.stroke();
    ctx.strokeStyle=m.agua; ctx.lineWidth=40*cam.z; poligono(r,false); ctx.stroke();
  });
  // Caminos
  m.caminos.forEach(c=>{
    ctx.strokeStyle= mapaActual===1?'#2a2d3d':'#a98f5f'; ctx.lineWidth=16*cam.z;
    poligono(c,false); ctx.stroke();
    ctx.strokeStyle= mapaActual===1?'#3d4155':'#c4a56d'; ctx.lineWidth=3*cam.z;
    ctx.setLineDash([12*cam.z,12*cam.z]); poligono(c,false); ctx.stroke(); ctx.setLineDash([]);
  });

  // Zonas POI (halo)
  m.pois.forEach(p=>{
    const s=w2s(p.x,p.y);
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,p.r*cam.z);
    g.addColorStop(0,'rgba(255,255,255,.09)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,p.r*cam.z,0,7); ctx.fill();
  });

  // Edificios
  props.edificios.forEach(e=>{
    const s=w2s(e.x,e.y);
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(e.rot);
    const wz=e.w*cam.z, hz=e.h*cam.z;
    ctx.fillStyle= mapaActual===1?'#2b2f45': mapaActual===2?'#8a97a4':'#6b5842';
    ctx.fillRect(-wz/2,-hz/2,wz,hz);
    ctx.fillStyle= mapaActual===1?'#40476b': mapaActual===2?'#b6c2cd':'#8a7355'; // techo
    ctx.fillRect(-wz/2,-hz/2,wz,hz*0.5);
    // ventanas neón en ciudad
    if(mapaActual===1 && cam.z>0.4){
      ctx.fillStyle='#3fd0ff';
      for(let vx=-wz/2+4; vx<wz/2-4; vx+=8) ctx.fillRect(vx,-hz/2+3,3,3);
    }
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; ctx.strokeRect(-wz/2,-hz/2,wz,hz);
    ctx.restore();
  });

  // Árboles
  props.arboles.forEach(t=>{
    const s=w2s(t.x,t.y); if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40) return;
    const r=t.s*cam.z;
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(s.x+r*0.3,s.y+r*0.3,r,0,7); ctx.fill();
    ctx.fillStyle= t.nieve?'#e7f0f6': mapaActual===1?'#1f7a3a':'#2f8f45';
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,7); ctx.fill();
    ctx.fillStyle= t.nieve?'#c7d8e4':'#227a37';
    ctx.beginPath(); ctx.arc(s.x-r*0.3,s.y-r*0.3,r*0.55,0,7); ctx.fill();
  });

  // Cofres (brillo dorado)
  const tt=performance.now()/400;
  props.cofres.forEach(c=>{
    const s=w2s(c.x,c.y); if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20) return;
    const pz=(6+Math.sin(tt+c.t*6))*cam.z;
    ctx.fillStyle='rgba(255,210,63,.28)'; ctx.beginPath(); ctx.arc(s.x,s.y,pz*2.2,0,7); ctx.fill();
    ctx.fillStyle='#caa23a'; ctx.fillRect(s.x-5*cam.z,s.y-4*cam.z,10*cam.z,8*cam.z);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(s.x-5*cam.z,s.y-4*cam.z,10*cam.z,3*cam.z);
  });

  // Cajas de suministro (globo)
  props.drops.forEach(d=>{
    const s=w2s(d.x,d.y);
    ctx.fillStyle='#2a3550'; ctx.fillRect(s.x-9*cam.z,s.y-9*cam.z,18*cam.z,18*cam.z);
    ctx.strokeStyle='#5fd0ff'; ctx.lineWidth=2; ctx.strokeRect(s.x-9*cam.z,s.y-9*cam.z,18*cam.z,18*cam.z);
    ctx.fillStyle='#8a4cff'; ctx.beginPath(); ctx.arc(s.x,s.y-26*cam.z,13*cam.z,0,7); ctx.fill();
    ctx.strokeStyle='#8a4cff'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(s.x-9*cam.z,s.y-9*cam.z); ctx.lineTo(s.x-6*cam.z,s.y-16*cam.z);
    ctx.moveTo(s.x+9*cam.z,s.y-9*cam.z); ctx.lineTo(s.x+6*cam.z,s.y-16*cam.z); ctx.stroke();
  });

  // Ruta del bus
  const bs=w2s(bus.x,bus.y);
  ctx.strokeStyle='rgba(95,208,255,.35)'; ctx.lineWidth=3; ctx.setLineDash([10,10]);
  ctx.beginPath();
  const e1=w2s(bus.x-Math.cos(bus.ang)*3000, bus.y-Math.sin(bus.ang)*3000);
  const e2=w2s(bus.x+Math.cos(bus.ang)*3000, bus.y+Math.sin(bus.ang)*3000);
  ctx.moveTo(e1.x,e1.y); ctx.lineTo(e2.x,e2.y); ctx.stroke(); ctx.setLineDash([]);
  if(bus.activo){
    ctx.save(); ctx.translate(bs.x,bs.y); ctx.rotate(bus.ang);
    ctx.font=`${28*cam.z}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🚌', 0, 0);
    ctx.restore();
  }

  // Etiquetas de POIs
  ctx.textAlign='center'; ctx.textBaseline='middle';
  m.pois.forEach(p=>{
    const s=w2s(p.x,p.y);
    ctx.font=`800 ${Math.max(11,14*cam.z)}px "Segoe UI"`;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.strokeText(p.n.toUpperCase(), s.x, s.y);
    ctx.fillStyle='#fff'; ctx.fillText(p.n.toUpperCase(), s.x, s.y);
  });

  // Tormenta: oscurecer todo fuera del círculo seguro
  const sc=w2s(storm.cx,storm.cy), R=storm.r*cam.z;
  ctx.save();
  ctx.fillStyle='rgba(138,76,255,.30)';
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(sc.x,sc.y,R,0,7,true); ctx.fill('evenodd');
  ctx.strokeStyle='rgba(180,130,255,.9)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(sc.x,sc.y,R,0,7); ctx.stroke();
  // círculo destino (blanco punteado)
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; ctx.setLineDash([8,8]);
  ctx.beginPath(); ctx.arc(sc.x,sc.y,storm.rDest*cam.z,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();

  // Baliza
  if(baliza){
    const s=w2s(baliza.x,baliza.y), pz=(1+Math.sin(performance.now()/200)*0.15);
    ctx.font=`${30*pz}px serif`; ctx.textAlign='center';
    ctx.fillText('📍', s.x, s.y);
  }

  // Indicador central "vos jugarías acá"
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.beginPath(); ctx.arc(W/2,H/2,7,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(W/2,H/2,7,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2-13,H/2); ctx.lineTo(W/2-4,H/2);
  ctx.moveTo(W/2+4,H/2); ctx.lineTo(W/2+13,H/2);
  ctx.moveTo(W/2,H/2-13); ctx.lineTo(W/2,H/2-4);
  ctx.moveTo(W/2,H/2+4); ctx.lineTo(W/2,H/2+13); ctx.stroke();

  pintarMini();
}

// ---------- Minimapa ----------
function pintarMini(){
  const m=MAPAS[mapaActual], k=184/MUNDO;
  mctx.fillStyle=m.fondo; mctx.fillRect(0,0,184,184);
  m.lagos.forEach(l=>{ mctx.fillStyle=m.agua; mctx.beginPath(); mctx.arc(l[0]*k,l[1]*k,l[2]*k,0,7); mctx.fill(); });
  m.rios.forEach(r=>{ mctx.strokeStyle=m.agua; mctx.lineWidth=3; mctx.beginPath(); r.forEach((p,i)=>{ i?mctx.lineTo(p[0]*k,p[1]*k):mctx.moveTo(p[0]*k,p[1]*k); }); mctx.stroke(); });
  m.pois.forEach(p=>{
    mctx.fillStyle='rgba(255,255,255,.85)'; mctx.beginPath(); mctx.arc(p.x*k,p.y*k,2.5,0,7); mctx.fill();
  });
  // drops
  props.drops.forEach(d=>{ mctx.fillStyle='#8a4cff'; mctx.fillRect(d.x*k-2,d.y*k-2,4,4); });
  // tormenta
  mctx.strokeStyle='rgba(180,130,255,.95)'; mctx.lineWidth=1.5;
  mctx.beginPath(); mctx.arc(storm.cx*k,storm.cy*k,storm.r*k,0,7); mctx.stroke();
  mctx.strokeStyle='rgba(255,255,255,.6)'; mctx.setLineDash([3,3]);
  mctx.beginPath(); mctx.arc(storm.cx*k,storm.cy*k,storm.rDest*k,0,7); mctx.stroke(); mctx.setLineDash([]);
  // baliza
  if(baliza){ mctx.fillStyle='#ffd23f'; mctx.beginPath(); mctx.arc(baliza.x*k,baliza.y*k,3,0,7); mctx.fill(); }
  // cámara (rectángulo de vista)
  const vw=(W/cam.z)*k, vh=(H/cam.z)*k;
  mctx.strokeStyle='#fff'; mctx.lineWidth=1;
  mctx.strokeRect(cam.x*k-vw/2, cam.y*k-vh/2, vw, vh);
  // punto central
  mctx.fillStyle='#fff'; mctx.beginPath(); mctx.arc(cam.x*k,cam.y*k,2,0,7); mctx.fill();
}

// ---------- Lógica de tormenta + reloj ----------
let vivos=98;
function tickStorm(dt){
  storm.tFase -= dt;
  if(storm.tFase<=0){
    storm.tFase=45;
    storm.rDest=Math.max(180, storm.r*0.6);
    // nuevo centro dentro del círculo actual
    const a=Math.random()*7, d=Math.random()*(storm.r-storm.rDest);
    storm.cx+=Math.cos(a)*d; storm.cy+=Math.sin(a)*d;
    const av=document.getElementById('aviso'); av.classList.add('show');
    setTimeout(()=>av.classList.remove('show'),3000);
  }
  // acercar r a rDest
  storm.r += (storm.rDest-storm.r)*Math.min(1,dt*0.4);
  // reloj
  const t=Math.max(0,storm.tFase);
  document.getElementById('reloj').textContent = `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  // ir bajando vivos suave
  if(Math.random()<dt*0.25 && vivos>1){ vivos--; document.getElementById('vivos').textContent=vivos; }
}

// ---------- Bucle principal ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  // movimiento cámara
  const v=520/cam.z*dt;
  if(teclas['w']||teclas['arrowup']) cam.y-=v;
  if(teclas['s']||teclas['arrowdown']) cam.y+=v;
  if(teclas['a']||teclas['arrowleft']) cam.x-=v;
  if(teclas['d']||teclas['arrowright']) cam.x+=v;
  cam.x=Math.max(0,Math.min(MUNDO,cam.x)); cam.y=Math.max(0,Math.min(MUNDO,cam.y));
  // bus vuela
  if(bus.activo){ bus.x+=Math.cos(bus.ang)*260*dt; bus.y+=Math.sin(bus.ang)*260*dt; if(bus.x>MUNDO+300) bus.activo=false; }
  tickStorm(dt);
  render();
  requestAnimationFrame(loop);
}

// ---------- Arranque ----------
generarProps(); pintarInv(); pintarMaps(); reiniciarBus();
requestAnimationFrame(loop);
</script>
