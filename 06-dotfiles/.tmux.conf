# ~/.tmux.conf — estilo rose-pine

# Prefijo Ctrl+a (más cómodo que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Colores reales y soporte de cursor
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Empezar ventanas/paneles en 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Dividir paneles con | y -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Recargar config con prefijo + r
bind r source-file ~/.tmux.conf \; display "Config recargada"

# Navegar paneles con Alt+flechas (sin prefijo)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ===== Estética rose-pine =====
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left "#[fg=#191724,bg=#c4a7e7,bold] #S #[fg=#c4a7e7,bg=#191724]"
set -g status-left-length 30
set -g status-right "#[fg=#26233a,bg=#191724]#[fg=#e0def4,bg=#26233a] %d/%m #[fg=#c4a7e7,bg=#26233a]#[fg=#191724,bg=#c4a7e7,bold] %H:%M "
set -g status-right-length 40

setw -g window-status-format "#[fg=#6e6a86,bg=#191724] #I:#W "
setw -g window-status-current-format "#[fg=#191724,bg=#31748f,bold] #I:#W #[fg=#31748f,bg=#191724]"

set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#c4a7e7,fg=#191724"
