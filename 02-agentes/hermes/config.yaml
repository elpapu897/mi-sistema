model:
  default: gpt-6-astra
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
providers:
  ollama-launch:
    api: http://127.0.0.1:11434/v1
    default_model: deepseek-v4-flash:cloud
    models:
      - deepseek-v4-flash:cloud
    name: Ollama
  apinex:
    api: https://api.apinex.bond/v1
    key_env: APINEX_API_KEY
    transport: chat_completions
    default_model: free/mimo-v2.5
toolsets:
  - hermes-cli
  - web
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  personalities: {}
  reasoning_effort: medium
  verbose: false
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: firecrawl
  use_gateway: true
browser:
  inactivity_timeout: 120
  cloud_provider: browser-use
  use_gateway: true
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  language: es
  interim_assistant_messages: true
  busy_ack_detail: true
  cleanup_progress: false
  long_running_notifications: true
  tool_progress: all
tts:
  provider: openai
  openai:
    model: tts-1
    voice: ash
  use_gateway: true
stt:
  enabled: true
  provider: openai
  language: es
  local:
    model: base
  openai:
    model: whisper-1
    language: es
  use_gateway: true
voice:
  auto_tts: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  flush_min_turns: 6
  nudge_interval: 10
delegation:
  max_iterations: 250
moa:
  presets:
    default:
      reference_models:
        - enabled: true
          model: gpt-5.5
          provider: openai-codex
        - enabled: true
          model: deepseek/deepseek-v4-pro
          provider: openrouter
        - enabled: true
          model: anthropic/claude-opus-4.8
          provider: openrouter
      degraded_reference_policy: loud
      fanout: user_turn
  aggregator:
    model: anthropic/claude-opus-4.8
    provider: openrouter
  degraded_reference_policy: loud
  enabled: true
  fanout: user_turn
  max_tokens: 4096
  reference_models:
    - enabled: true
      model: gpt-5.5
      provider: openai-codex
    - enabled: true
      model: deepseek/deepseek-v4-pro
      provider: openrouter
    - enabled: true
